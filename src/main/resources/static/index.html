<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>EPG Grid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Optional: <meta name="api-port" content="9090"> -->

    <!-- Tailwind (layout only; colors via CSS variables) -->
    <script>window.tailwind={config:{darkMode:'class'}};</script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- hls.js for HLS streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

    <style>
        :root{
          --row-h: 64px;

          /* Light theme */
          --bg:            #f8fafc;  /* page background */
          --fg:            #0f172a;  /* text */
          --muted:         #475569;
          --surface:       #ffffff;  /* header/cards */
          --surface-weak:  #f1f5f9;  /* sticky header bg */
          --cell-bg:       #ffffff;  /* programme cells */
          --border:        #e5e7eb;  /* borders */
          --cell-border:   #d1d5db;
          --now:           #3b82f6;
          --icon:          #334155;

          --toggle-bg:         #ffffff;
          --toggle-border:     #cbd5e1;
          --toggle-active:     #e0e7ff;
          --toggle-active-brd: #6366f1;
          --toggle-icon:       #334155;
          --toggle-icon-act:   #3730a3;
          --chip-bg:           #ffffff;
          --chip-border:       #e5e7eb;
          --input-bg:          #ffffff;
          --input-brd:         #cbd5e1;
        }
        .dark{
          /* Dark theme */
          --bg:            #0b1220;
          --fg:            #e5e7eb;
          --muted:         #cbd5e1;
          --surface:       #0f172a;
          --surface-weak:  #111827;
          --cell-bg:       #111827;
          --border:        #334155;
          --cell-border:   #374151;
          --now:           #60a5fa;
          --icon:          #cbd5e1;

          --toggle-bg:         #0f172a;
          --toggle-border:     #475569;
          --toggle-active:     #1f2937;
          --toggle-active-brd: #6366f1;
          --toggle-icon:       #cbd5e1;
          --toggle-icon-act:   #a5b4fc;
          --chip-bg:           #0b1220;
          --chip-border:       #334155;
          --input-bg:          #0f172a;
          --input-brd:         #475569;
        }

        /* Generic themed helpers */
        body       { overflow: hidden; background: var(--bg); color: var(--fg); }
        .t-surface { background: var(--surface); color: var(--fg); border-color: var(--border); }
        .t-weak    { background: var(--surface-weak); }
        .t-border  { border-color: var(--border); }
        .t-input   { background: var(--input-bg); border-color: var(--input-brd); color: var(--fg); }
        .t-muted   { color: var(--muted); }
        .t-link    { color: #4f46e5; }  /* indigo-600-ish */
        .t-link:hover { color: #3730a3; }

        /* EPG-specific */
        .epg-cell{
          position:absolute; top:0; bottom:0;
          border:1px solid var(--cell-border); border-radius:.25rem;
          background:var(--cell-bg); padding:.25rem .5rem;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
          font-size:.75rem; box-sizing:border-box;
        }
        .now-line{ position:absolute; top:0; bottom:0; width:2px; background:var(--now); z-index:20; }
        .epg-row{ position:relative; height:var(--row-h); border-bottom:1px solid var(--border); box-sizing:border-box; }
        .channel-cell{
          position:sticky; left:0; display:flex; align-items:center; gap:.5rem;
          width:15rem; min-width:15rem; height:100%;
          background:var(--chip-bg); border-right:1px solid var(--chip-border);
          box-sizing:border-box; padding:0 .5rem; z-index:5;
        }
        .play-toggle{
          appearance:none; width:22px; height:22px; border-radius:6px;
          border:1px solid var(--toggle-border); display:grid; place-items:center;
          cursor:pointer; background:var(--toggle-bg);
        }
        .play-toggle::before{ content:"▶"; font-size:12px; color:var(--toggle-icon); }
        .play-toggle:checked{ background:var(--toggle-active); border-color:var(--toggle-active-brd); }
        .play-toggle:checked::before{ content:"■"; color:var(--toggle-icon-act); }

        /* Tiny button highlight for emoji theme buttons */
        .is-active { background: #e0e7ff; border-color:#6366f1; }
        .dark .is-active { background: #1f2937; border-color:#6366f1; }
    </style>

    <!-- Theme bootstrap (earliest; tolerant of missing body) -->
    <script>
        const THEME_COOKIE='ui_theme';
        const mqDark = window.matchMedia('(prefers-color-scheme: dark)');

        function setCookie(name,val,days=365){
          const maxAge=days*86400, secure=location.protocol==='https:'?'; Secure':'';
          document.cookie=`${name}=${encodeURIComponent(val)}; Path=/; Max-Age=${maxAge}; SameSite=Strict${secure}`;
        }
        function getCookie(name){
          const map=document.cookie.split('; ').reduce((a,p)=>{const[k,...r]=p.split('=');a[k]=r.join('=');return a;},{});
          return map[name]?decodeURIComponent(map[name]):'';
        }
        function setModeClass(mode){
          const root=document.documentElement, body=document.body||null;
          root.classList.remove('dark'); if(body) body.classList.remove('dark');
          const dark = mode==='dark' || (mode==='auto' && mqDark.matches);
          if(dark){ root.classList.add('dark'); if(body) body.classList.add('dark'); }
          if(!body){
            document.addEventListener('DOMContentLoaded',()=>{
              const b=document.body;
              b.classList.remove('dark');
              if(dark) b.classList.add('dark');
            },{once:true});
          }
        }
        function bindSystemListener(mode){
          mqDark.onchange=null;
          if(mode==='auto'){ mqDark.onchange=()=>setModeClass('auto'); }
        }
        function updateThemeButtons(mode){
          const btns=document.querySelectorAll('#themeButtons .theme-btn');
          btns.forEach(b=>b.classList.toggle('is-active', b.dataset.theme===mode));
        }
        function initTheme(){
          const saved=(getCookie(THEME_COOKIE)||'auto').toLowerCase();
          const mode=['auto','light','dark'].includes(saved)?saved:'auto';
          setModeClass(mode); bindSystemListener(mode);
          if(document.readyState==='loading'){
            document.addEventListener('DOMContentLoaded',()=>updateThemeButtons(mode),{once:true});
          }else updateThemeButtons(mode);
          return mode;
        }
        let currentMode=initTheme();
        window.addEventListener('DOMContentLoaded',()=>{
          document.querySelectorAll('#themeButtons .theme-btn').forEach(btn=>{
            btn.addEventListener('click',()=>{
              currentMode=btn.dataset.theme;
              setModeClass(currentMode); bindSystemListener(currentMode);
              setCookie(THEME_COOKIE,currentMode); updateThemeButtons(currentMode);
            });
          });
        });
    </script>
</head>
<body class="antialiased">
<div class="flex h-screen flex-col">
    <!-- Header -->
    <header class="t-surface border-b flex items-center gap-3 px-4 py-2 shadow">
        <h1 class="text-lg md:text-xl font-semibold">📺 TV Guide</h1>

        <!-- Search -->
        <div class="relative">
            <input id="searchBox" type="text" placeholder="Search channel…"
                   class="t-input rounded border px-3 py-1 text-sm focus:outline-none focus:ring"
                   style="min-width:12rem;">
            <button id="clearSearch"
                    class="absolute right-1 top-1 text-xs t-muted hidden">✕</button>
        </div>

        <!-- Theme emoji buttons -->
        <div id="themeButtons" class="ml-2 flex items-center gap-2 text-sm">
            <span class="t-muted">Theme:</span>
            <button data-theme="light" title="Light"
                    class="theme-btn px-2 py-1 rounded border t-border">🌞</button>
            <button data-theme="dark" title="Dark"
                    class="theme-btn px-2 py-1 rounded border t-border">🌙</button>
            <button data-theme="auto" title="Auto (System)"
                    class="theme-btn px-2 py-1 rounded border t-border">🌓</button>
        </div>

        <!-- Links: M3U & EPG -->
        <div class="ml-2 flex items-center gap-3 text-sm">
            <a id="m3uLink" href="#" target="_blank" class="flex items-center gap-1 t-link" title="Open M3U playlist">
                <span>📄</span><span>M3U</span>
            </a>
            <a id="epgLink" href="#" target="_blank" class="flex items-center gap-1 t-link" title="Open EPG (XMLTV)">
                <span>🗓️</span><span>EPG</span>
            </a>
        </div>

        <div class="ml-auto flex items-center gap-2 text-sm">
            <span class="t-muted">Gridspan:</span>
            <button data-span="3"  class="px-2 py-1 rounded border t-border">3h</button>
            <button data-span="6"  class="px-2 py-1 rounded border t-border">6h</button>
            <button data-span="9"  class="px-2 py-1 rounded border t-border is-active">9h</button>
            <button data-span="12" class="px-2 py-1 rounded border t-border">12h</button>

            <div class="h-4 w-px mx-2" style="background: var(--border)"></div>

            <label class="t-muted">Page size</label>
            <select id="pageSize" class="t-input rounded border px-2 py-1">
                <option>10</option><option>25</option><option selected>50</option><option>100</option>
            </select>
            <span id="pageInfo" class="t-muted"></span>
        </div>
    </header>

    <!-- Combined scroll -->
    <div id="scrollContainer" class="flex-1 overflow-auto t-surface" style="background: var(--surface);">
        <!-- Sticky time header -->
        <div class="sticky top-0 z-10 t-weak t-border border-b flex">
            <div class="w-[15rem] min-w-[15rem] border-r t-border" style="background: var(--surface);"></div>
            <div id="timeHeader" class="flex text-xs" style="color: var(--muted);"></div>
        </div>

        <!-- Grid rows -->
        <div id="epgGrid" class="relative">
            <div id="nowLine" class="now-line"></div>
        </div>
        <!-- Infinite scroll footer -->
        <div id="pagerFooter" class="py-3 text-center text-sm t-muted hidden">⏳ Loading…</div>
        </div>

    <div id="status" class="px-4 py-1 text-sm t-muted"></div>
</div>

<!-- Floating mini player -->
<div id="playerDock" class="fixed bottom-3 right-3 z-50 hidden">
    <div class="w-[360px] rounded-xl border t-border t-surface shadow-xl">
        <div class="flex items-center justify-between px-3 py-2 border-b t-border">
            <div id="playerTitle" class="text-sm font-medium truncate">Now Playing</div>
            <button id="closePlayer" class="text-xs px-2 py-1 rounded border t-border">Close</button>
        </div>
        <div class="p-2">
            <video id="dockVideo" class="w-full aspect-video rounded" style="background:#000" controls autoplay muted playsinline crossorigin="anonymous"></video>
            <!-- Current programme info -->
            <div id="playerProg" class="mt-2 text-xs rounded border t-border p-2 hidden">
                <div class="flex items-center justify-between gap-2">
                    <div id="playerProgTitle" class="font-medium truncate">—</div>
                    <div id="playerProgTime" class="t-muted whitespace-nowrap">—</div>
                </div>
                <div class="mt-1 h-1 rounded" style="background: var(--surface-weak)">
                    <div id="playerProgProgress" class="h-1 rounded" style="background: var(--now); width:0%"></div>
                </div>
                <div id="playerProgDesc" class="mt-1 t-muted"></div>
            </div>
            <div id="playerError" class="mt-2 text-xs hidden" style="color:#ef4444"></div>
        </div>
    </div>
</div>

<script>
    /* API base */
    const DEFAULT_PORT = 8080;
    const metaPort = document.querySelector('meta[name="api-port"]')?.content;
    const urlPort  = new URLSearchParams(location.search).get('apiPort');
    const rawPort  = (window.ENV_API_PORT ?? metaPort ?? urlPort ?? location.port ?? DEFAULT_PORT);
    const PORT     = String(rawPort).trim() || String(DEFAULT_PORT);
    const HOST     = location.hostname || 'localhost';
    const PROTO    = location.protocol || 'http:';
    const API_BASE = `${PROTO}//${HOST}:${PORT}`;

    // Wire links
    const m3uLink = document.getElementById('m3uLink');
    const epgLink = document.getElementById('epgLink');
    if (m3uLink) m3uLink.href = `${API_BASE}/api/v1/m3u`;
    if (epgLink) epgLink.href = `${API_BASE}/api/v1/epg`;

    const CH_API   = '/api/v1/m3u/mappings/channel';
    const PRG_API  = (id) => `/api/v1/epg/channel/${id}/programmes?size=500&sort=startTime,asc`;

    /* Elements */
    const epgGrid = document.getElementById('epgGrid');
    const timeHeader = document.getElementById('timeHeader');
    const nowLine = document.getElementById('nowLine');
    const statusEl = document.getElementById('status');
    const pageSizeEl = document.getElementById('pageSize');
    const pageInfoEl = document.getElementById('pageInfo');
    const scrollContainer = document.getElementById('scrollContainer');
    const pagerFooter = document.getElementById('pagerFooter');

    const playerDock = document.getElementById('playerDock');
    const dockVideo  = document.getElementById('dockVideo');
    const playerTitle = document.getElementById('playerTitle');
    const playerError = document.getElementById('playerError');
    const closePlayer = document.getElementById('closePlayer');
    const playerProg = document.getElementById('playerProg');
    const playerProgTitle = document.getElementById('playerProgTitle');
    const playerProgTime = document.getElementById('playerProgTime');
    const playerProgProgress = document.getElementById('playerProgProgress');
    const playerProgDesc = document.getElementById('playerProgDesc');

    const searchBox = document.getElementById('searchBox');
    const clearBtn  = document.getElementById('clearSearch');

    /* State */
    const PIXELS_PER_MIN = 3;  // 180px/hour
    let hoursSpan = 9, page = 0;
    let size = Number(localStorage.getItem('epgPageSize')) || 50;
    pageSizeEl.value = String(size);
    let totalPages = Infinity, totalElements = 0;
    let isLoading = false;
    let initialized = false;
    let gridStart, gridEnd;

    let hls = null;
    let selectedKey = null;
    const channelProgrammes = new Map();

    /* Helpers */
    const safe = (v) => v == null ? '' : String(v);
    const fmtTime = (t) => new Date(t).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    const alignHourUTC = (d) => { const x = new Date(d); x.setUTCMinutes(0,0,0); return x; };
    const totalWidthPx = () => (hoursSpan * 60 * PIXELS_PER_MIN);
    function setStatus(msg){ statusEl.textContent = msg; }
    function setFooter(mode){
      // mode: 'loading' | 'all' | 'hidden'
      if (!pagerFooter) return;
      pagerFooter.classList.remove('hidden');
      if (mode === 'loading') {
        pagerFooter.textContent = '⏳ Loading…';
      } else if (mode === 'all') {
        pagerFooter.textContent = '🏁 All loaded';
      } else {
        pagerFooter.classList.add('hidden');
      }
    }
    function setPageInfo(){
      const tp = (totalPages === Infinity) ? '?' : totalPages;
      pageInfoEl.textContent = `Loaded page ${page} / ${tp} • ${totalElements.toLocaleString()} rows`;
    }
    const isHls = (u) => /\.m3u8(\?.*)?$/i.test(u) || (u && u.includes('m3u8'));

    /* Time header */
    function renderTimeHeader(){
      const hourWidth = 60 * PIXELS_PER_MIN;
      const cols = [];
      const cursor = new Date(gridStart);
      while (cursor < gridEnd) {
        const label = cursor.toLocaleTimeString([], { hour:'numeric' });
        cols.push(`<div class="flex-none text-center border-l t-border w-[${hourWidth}px] py-1" style="background: var(--surface); color: var(--muted);">${label}</div>`);
        cursor.setHours(cursor.getHours()+1);
      }
      timeHeader.style.width = totalWidthPx() + 'px';
      timeHeader.innerHTML = cols.join('');
    }

    /* Data + render */
    async function loadChannelsPage(pageIdx){
      setStatus('⏳ Loading channels…');
      const res = await fetch(`${API_BASE}${CH_API}?page=${pageIdx}&size=${size}&sort=title,asc`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      totalPages    = data.totalPages ?? totalPages;
      totalElements = data.totalElements ?? totalElements;
      setPageInfo();
      return data.content || [];
    }

    function renderProgrammeRow(container, channel, programmes){
      try { channelProgrammes.set(channel.channelId, programmes || []); } catch(_){}
      const startTs = gridStart.getTime();
      const endTs   = gridEnd.getTime();

      const row = document.createElement('div');
      row.className = 'epg-row flex';
      row.dataset.channelId = channel.channelId || '';
      row.dataset.url = channel.url || '';
      row.dataset.name = channel.displayName || channel.title || 'Unknown';

      row.innerHTML = `
        <div class="channel-cell">
          <input type="checkbox" class="play-toggle" title="Play / Stop">
          ${channel.tvIconUrl
            ? `<img src="${safe(channel.tvIconUrl)}" alt="${safe(channel.tvId)}"
                    class="h-8 w-8 rounded object-cover" style="outline:1px solid var(--border)"
                    onerror="this.style.display='none'">`
            : `<div class="h-8 w-8 rounded flex items-center justify-center text-[10px]"
                 style="background:#cbd5e1;color:#334155">${safe(channel.title||'?').slice(0,2)}</div>`
          }
          <div class="text-xs font-medium truncate">${safe(channel.title)}</div>
        </div>
        <div class="relative flex-1 overflow-hidden" style="height: var(--row-h)"></div>`;

      const progLayer = row.querySelector('.relative');

      for (const p of programmes) {
        const s = Date.parse(p.startTime);
        const e = Date.parse(p.stopTime);
        if (!isFinite(s) || !isFinite(e)) continue;
        if (e <= startTs || s >= endTs) continue;

        const leftMin  = (Math.max(s, startTs) - startTs) / 60000;
        const widthMin = (Math.min(e, endTs) - Math.max(s, startTs)) / 60000;
        const left  = leftMin  * PIXELS_PER_MIN;
        const width = Math.max(30, widthMin * PIXELS_PER_MIN);

        const div = document.createElement('div');
        div.className = 'epg-cell';
        div.style.left = left + 'px';
        div.style.width = width + 'px';
        div.title = `${fmtTime(p.startTime)}–${fmtTime(p.stopTime)}\n${p.description || ''}`;
        const cellText = p.m3uItemTitle ? `${safe(p.m3uItemTitle)} · ${safe(p.title || '')}` : `${safe(p.title || '')}`;
        div.innerHTML = `<div class="font-semibold truncate">${cellText}</div>`;
        progLayer.appendChild(div);
      }

      const toggle = row.querySelector('.play-toggle');
      toggle.addEventListener('change', () => onTogglePlay(row));

      container.appendChild(row);
    }

    function findCurrentProgramme(list){
      if (!Array.isArray(list) || list.length === 0) return null;
      const now = Date.now();
      for (const p of list) {
        const s = Date.parse(p.startTime);
        const e = Date.parse(p.stopTime);
        if (!isFinite(s) || !isFinite(e)) continue;
        if (s <= now && now < e) return p;
      }
      return null;
    }

    async function updatePlayerProgramme(fetchIfMissing=true){
      if (!selectedKey) { playerProg?.classList.add('hidden'); return; }
      let list = channelProgrammes.get(selectedKey) || null;
      if ((!list || list.length === 0) && fetchIfMissing) {
        try {
          const res = await fetch(`${API_BASE}${PRG_API(selectedKey)}`);
          if (res.ok) {
            const data = await res.json();
            list = data.content || [];
            channelProgrammes.set(selectedKey, list);
          }
        } catch(_){}
      }
      const cur = findCurrentProgramme(list||[]);
      if (!cur) {
        playerProgTitle.textContent = 'No current programme';
        playerProgTime.textContent = '';
        playerProgDesc.textContent = '';
        playerProgProgress.style.width = '0%';
        playerProg.classList.remove('hidden');
        return;
      }
      const s = Date.parse(cur.startTime);
      const e = Date.parse(cur.stopTime);
      const now = Date.now();
      const pct = Math.max(0, Math.min(1, (now - s) / Math.max(1, (e - s)))) * 100;
      const titleText = cur.m3uItemTitle ? `${safe(cur.m3uItemTitle)} · ${safe(cur.title||'')}` : `${safe(cur.title||'')}`;
      playerProgTitle.textContent = titleText || '—';
      playerProgTime.textContent = `${fmtTime(cur.startTime)}–${fmtTime(cur.stopTime)}`;
      playerProgDesc.textContent = safe(cur.description||'');
      playerProgProgress.style.width = pct.toFixed(1) + '%';
      playerProg.classList.remove('hidden');
    }

    function renderNowLine(){
      const startTs = gridStart.getTime();
      const endTs   = gridEnd.getTime();
      const nowTs   = Date.now();
      const offsetMin = (nowTs - startTs) / 60000;
      const x = offsetMin * PIXELS_PER_MIN;
      nowLine.style.left = x + 'px';
      nowLine.style.display = (nowTs < startTs || nowTs > endTs) ? 'none' : 'block';
    }

    async function initGridAndHeader(){
      const nowUTC = new Date();
      gridStart = alignHourUTC(nowUTC);
      gridStart = new Date(gridStart.getTime() - 30 * 60_000);
      gridEnd   = new Date(gridStart.getTime() + (hoursSpan * 3600_000) + 30 * 60_000);
      renderTimeHeader();
      if (!initialized) {
        epgGrid.innerHTML = '<div id="nowLine" class="now-line"></div>';
        initialized = true;
      }
      renderNowLine();
    }

    async function loadNextPage(){
      if (isLoading) return;
      if (page >= totalPages) { setStatus('✅ All pages loaded.'); return; }
      isLoading = true;
      setFooter('loading');
      try {
        const current = page;
        const channels = await loadChannelsPage(current);
        const tasks = channels.map(ch =>
          fetch(`${API_BASE}${PRG_API(ch.channelId)}`)
            .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
            .then(page => ({ ch, programmes: page.content || [] }))
            .catch(_ => ({ ch, programmes: [] }))
        );
        const results = await Promise.allSettled(tasks);
        for (const r of results) {
          if (r.status === 'fulfilled') renderProgrammeRow(epgGrid, r.value.ch, r.value.programmes);
        }
        page = current + 1;
        renderNowLine();
        setStatus('✅ Loaded page ' + current + '.');
        if (page >= totalPages) setFooter('all'); else setFooter('hidden');
        if ((searchBox?.value || '').trim()) filterChannels();
      } catch (e) {
        console.error(e);
        setStatus('❌ ' + e.message);
        setFooter('hidden');
      } finally {
        isLoading = false;
      }
    }

    /* Player */
    function stopPlayer() {
      try {
        if (hls) { hls.destroy(); hls = null; }
        dockVideo.pause();
        dockVideo.removeAttribute('src');
        dockVideo.load();
      } catch (_) {}
      playerError.classList.add('hidden');
      playerDock.classList.add('hidden');
      if (playerProg) {
        playerProg.classList.add('hidden');
        playerProgTitle.textContent = '—';
        playerProgTime.textContent = '';
        playerProgDesc.textContent = '';
        playerProgProgress.style.width = '0%';
      }
      selectedKey = null;
      document.querySelectorAll('.epg-row .play-toggle:checked').forEach(cb => cb.checked = false);
    }
    function playUrl(name, url) {
      playerTitle.textContent = `Now Playing: ${name}`;
      playerError.classList.add('hidden');
      playerDock.classList.remove('hidden');
      updatePlayerProgramme();

      if (!url) {
        playerError.textContent = 'No stream URL provided.'; playerError.classList.remove('hidden'); return;
      }

      try { if (hls) { hls.destroy(); hls = null; } dockVideo.pause(); dockVideo.removeAttribute('src'); dockVideo.load(); } catch (_){}

      if (isHls(url)) {
        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({ lowLatencyMode: true, backBufferLength: 60 });
          hls.on(Hls.Events.ERROR, (evt, data) => {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
                case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
                default:
                  playerError.textContent = 'Fatal playback error.'; playerError.classList.remove('hidden'); stopPlayer();
              }
            }
          });
          hls.loadSource(url); hls.attachMedia(dockVideo);
          dockVideo.play().catch(()=>{});
        } else if (dockVideo.canPlayType('application/vnd.apple.mpegurl')) {
          dockVideo.src = url; dockVideo.play().catch(()=>{});
        } else {
          playerError.textContent = 'HLS not supported in this browser.'; playerError.classList.remove('hidden');
        }
      } else {
        dockVideo.src = url; dockVideo.play().catch(()=>{});
      }
    }
    function onTogglePlay(row) {
      const cb = row.querySelector('.play-toggle');
      const key = row.dataset.channelId;
      const url = row.dataset.url;
      const name = row.dataset.name;
      if (cb.checked) {
        if (selectedKey && selectedKey !== key) {
          document.querySelectorAll(`.epg-row[data-channel-id="${selectedKey}"] .play-toggle`).forEach(t => t.checked = false);
        }
        selectedKey = key; playUrl(name, url);
      } else {
        if (selectedKey === key) stopPlayer();
      }
    }
    document.getElementById('closePlayer').addEventListener('click', stopPlayer);

    /* Controls */
    document.querySelectorAll('button[data-span]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('button[data-span]').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        hoursSpan = Number(btn.getAttribute('data-span'));
        loadPageAndRender();
      });
    });
    pageSizeEl.onchange = () => {
      size = Number(pageSizeEl.value);
      localStorage.setItem('epgPageSize', size);
      // reset and reload
      page = 0; totalPages = Infinity; totalElements = 0; isLoading = false; initialized = false;
      epgGrid.innerHTML = '';
      initGridAndHeader();
      loadNextPage();
    };

    // Infinite scroll: load next page near bottom
    scrollContainer.addEventListener('scroll', () => {
      const {scrollTop, clientHeight, scrollHeight} = scrollContainer;
      if (scrollTop + clientHeight >= scrollHeight - 200) {
        loadNextPage();
      }
    });

    /* Search */
    function filterChannels() {
      const term = searchBox.value.trim().toLowerCase();
      const rows = document.querySelectorAll('#epgGrid .epg-row');
      let shown = 0;
      rows.forEach(r => {
        const name = (r.dataset.name || '').toLowerCase();
        const match = term === '' || name.includes(term);
        r.style.display = match ? 'flex' : 'none';
        if (match) shown++;
      });
      setStatus(term ? `🔍 ${shown} match${shown===1?'':'es'}` : '');
      clearBtn.classList.toggle('hidden', term === '');
    }
    searchBox.addEventListener('input', filterChannels);
    clearBtn.addEventListener('click', () => { searchBox.value=''; filterChannels(); searchBox.focus(); });

    setInterval(() => { renderNowLine(); if (selectedKey) updatePlayerProgramme(false); }, 60_000);
    initGridAndHeader();
    loadNextPage();
</script>
</body>
</html>
