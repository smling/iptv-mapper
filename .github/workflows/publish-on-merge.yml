name: Build & Publish (on merge to main)

on:
  pull_request:
    branches: [ "main" ]
    types: [ "closed" ]   # fire when PR is closed

permissions:
  contents: read
  packages: write         # needed to push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: "25"

jobs:
  publish:
    if: github.event.pull_request.merged == true   # only when merged (not closed without merge)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build fat JAR
        run: |
          ./gradlew --no-daemon clean bootJar
          echo "Built JARs:"
          ls -1 build/libs/*.jar
          # Your Dockerfile uses COPY build/libs/iptv-mapper-*-SNAPSHOT.jar
          # Ensure at least one SNAPSHOT JAR exists:
          test -n "$(ls -1 build/libs/*-SNAPSHOT.jar 2>/dev/null)" || {
            # if non-SNAPSHOT, rename the first jar to fit the Dockerfile glob
            j="$(ls -1 build/libs/*.jar | head -n1)"
            cp "$j" build/libs/iptv-mapper-0.0.0-SNAPSHOT.jar
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
