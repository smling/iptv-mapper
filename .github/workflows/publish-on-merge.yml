name: Build & Publish (on merge to main)

on:
  pull_request:
    branches: [ "main" ]
    types: [ "closed" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: "21"

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # needed to create/push tags
          persist-credentials: true # keep GITHUB_TOKEN for pushes

      - name: Configure git identity
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
      

      - name: Ensure UNIX line endings for scripts (optional but safe)
        run: |
          find . -name "gradlew" -o -name "*.sh" | xargs -r sed -i 's/\r$//'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build fat JAR
        run: |
          ./gradlew --no-daemon clean bootJar
          echo "Built JARs:"
          ls -1 build/libs/*.jar
          # Dockerfile copies iptv-mapper-*-SNAPSHOT.jar. Ensure one exists:
          test -n "$(ls -1 build/libs/*-SNAPSHOT.jar 2>/dev/null)" || {
            j="$(ls -1 build/libs/*.jar | head -n1)"
            cp "$j" build/libs/iptv-mapper-0.0.0-SNAPSHOT.jar
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- NEW: Create tag and GitHub release ---
      - name: Determine version
        id: version
        run: |
          # Try to read version from Gradle build if available
          if ./gradlew properties | grep -q "^version:"; then
            VERSION=$(./gradlew properties | grep "^version:" | awk '{print $2}')
          else
            VERSION="v$(date +'%Y.%m.%d-%H%M')"
          fi

          # Ensure tag starts with v
          [[ "$VERSION" != v* ]] && VERSION="v$VERSION"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🧾 Using version tag: $VERSION"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.version }}"
          git tag -fa "${TAG}" -m "Release ${TAG}"
          git push origin ":refs/tags/${TAG}" || true
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          body: |
            🚀 **Release ${{ steps.version.outputs.version }}**
            - Automatically published on merge to `main`
            - Includes the latest Docker image on GHCR
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}