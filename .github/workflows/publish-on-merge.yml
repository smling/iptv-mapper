name: Build, Publish & Release (after merge)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: "21"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize scripts
        run: |
          find . -name "gradlew" -o -name "*.sh" | xargs -r sed -i 's/\r$//'
          chmod +x gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build fat JAR
        run: |
          ./gradlew --no-daemon clean bootJar
          ls -1 build/libs/*.jar

      # >>> NEW: determine version early and expose both with & without leading v
      - name: Determine version
        id: version
        run: |
          V=$(./gradlew -q properties | awk -F': ' '/^version:/{print $2}')
          # fallback if not found
          if [ -z "$V" ]; then V="$(date +'%Y.%m.%d-%H%M')"; fi
          # strip SNAPSHOT for release image tags
          V_PLAIN="${V/-SNAPSHOT/}"
          # add v-variant too
          if [ "${V_PLAIN#v}" = "$V_PLAIN" ]; then V_TAG="v$V_PLAIN"; else V_TAG="$V_PLAIN"; fi
          echo "plain=$V_PLAIN" >> $GITHUB_OUTPUT
          echo "tag=$V_TAG" >> $GITHUB_OUTPUT
          echo "Using version: $V_PLAIN (tag: $V_TAG)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep metadata for labels if you like (optional)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.plain }}

      - name: Build & Push image (latest + version)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.plain }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- Tag & Release -----
      - name: Configure git identity
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Create tag if missing
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists on origin; skipping."
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            🚀 Release ${{ steps.version.outputs.tag }}
            - Container images:
              - ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.plain }}
              - ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
              - ghcr.io/${{ env.IMAGE_NAME }}:latest
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
