name: Build, Publish & Release (after merge)

on:
  push:
    branches: [ "main" ]   # runs after the PR is merged

permissions:
  contents: write          # needed to create tags & releases
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: "21"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                # allow tagging
          persist-credentials: true     # keep token for push

      - name: Normalize scripts
        run: |
          find . -name "gradlew" -o -name "*.sh" | xargs -r sed -i 's/\r$//'
          chmod +x gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build fat JAR
        run: |
          ./gradlew --no-daemon clean bootJar
          ls -1 build/libs/*.jar
          # ensure SNAPSHOT jar for Dockerfile glob if needed
          test -n "$(ls -1 build/libs/*-SNAPSHOT.jar 2>/dev/null)" || {
            j="$(ls -1 build/libs/*.jar | head -n1)"
            cp "$j" build/libs/iptv-mapper-0.0.0-SNAPSHOT.jar
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- Tag & Release -----
      - name: Configure git identity
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Determine version
        id: version
        run: |
          if ./gradlew properties | grep -q "^version:"; then
            V=$(./gradlew -q properties | awk -F': ' '/^version:/{print $2}')
          else
            V="$(date +'%Y.%m.%d-%H%M')"
          fi
          [[ "$V" != v* ]] && V="v$V"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Using tag: $V"

      - name: Create tag if missing
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists on origin; skipping."
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          body: |
            🚀 Release ${{ steps.version.outputs.version }}
            - Auto-published on push to `main`
            - Container: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
