name: CI

on:
  push:

permissions:
  contents: read
  security-events: write   # for CodeQL upload
  actions: read
  packages: read

env:
  JAVA_VERSION: "21"

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2

  build-test:
    runs-on: ubuntu-latest
    needs: wrapper-validation
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize scripts & make gradlew executable
        run: |
          find . -name "gradlew" -o -name "*.sh" | xargs -r sed -i 's/\r$//'
          chmod +x gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Run unit tests
        run: ./gradlew --no-daemon clean test

      - name: Generate coverage (if jacoco present)
        run: |
          if ./gradlew -q tasks --all | grep -qE '^\s+jacocoTestReport(\s|$)'; then
            ./gradlew --no-daemon jacocoTestReport
          else
            echo "ℹ️ jacocoTestReport task not found; skipping coverage."
          fi

      - name: Optional style & static analysis (run if tasks exist)
        run: |
          run_if_task() { ./gradlew -q tasks --all | grep -qE "^\s+$1(\s|$)" && ./gradlew --no-daemon $1 || echo "↷ skip $1"; }
          run_if_task spotlessCheck
          run_if_task checkstyleMain
          run_if_task checkstyleTest
          run_if_task pmdMain
          run_if_task pmdTest
          run_if_task spotbugsMain
          run_if_task spotbugsTest

      - name: Archive reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/reports/**/*
            **/build/reports/**/*

  dependency-audit:
    runs-on: ubuntu-latest
    needs: wrapper-validation
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Cache OWASP DC data dir
        uses: actions/cache@v4
        with:
          path: ${{ env.DC_DATA_DIR }}
          key: depcheck-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/pom.xml', '**/package-lock.json') }}
          restore-keys: |
            depcheck-${{ runner.os }}-

      # STEP 1: ensure DB exists (downloads NVD feeds)
      - name: Dependency-Check update-only (populate DB)
        uses: dependency-check/Dependency-Check_Action@main
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        with:
          project: "${{ github.repository }}-update"
          # a path is required, but update-only will skip scanning
          path: .
          out: build/reports/dependency-check
          format: "HTML"
          args: >
            --updateonly
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --data ${{ env.DC_DATA_DIR }}

      - name: Dependency-Check (NVD API key)
        uses: dependency-check/Dependency-Check_Action@main
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # <-- your secret
        with:
          project: ${{ github.repository }}
          path: .
          format: 'HTML'                       # reports to generate
          out: build/reports/dependency-check       # output directory
          # Fail build on CVSS >= 7.0 (tweak as needed)
          args: >
            --failOnCVSS 7
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --data ~/.org.owasp.dependencycheck

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-dependency-check
          path: dependency-check-report/**

  secrets-scan:
    runs-on: ubuntu-latest
    needs: wrapper-validation
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git -v --redact --report-format sarif --report-path gitleaks.sarif

      - name: Upload Gitleaks SARIF (if present)
        if: hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

  codeql:
    runs-on: ubuntu-latest
    needs: wrapper-validation
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
