name: CI

on:
  push:

permissions:
  contents: read
  security-events: write   # for CodeQL upload
  actions: read
  packages: read

env:
  JAVA_VERSION: "21"
  DC_DATA_DIR: ~/.org.owasp.dependencycheck

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - name: Summary
        if: always()
        run: |
          echo "### ✅ Gradle wrapper validation" >> $GITHUB_STEP_SUMMARY
          echo "Wrapper validated successfully." >> $GITHUB_STEP_SUMMARY

  build-test:
    runs-on: ubuntu-latest
    needs: wrapper-validation
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize scripts & make gradlew executable
        run: |
          find . -name "gradlew" -o -name "*.sh" | xargs -r sed -i 's/\r$//'
          chmod +x gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew --no-daemon clean test

      - name: Generate coverage (if jacoco present)
        run: |
          if ./gradlew -q tasks --all | grep -qE '^\s+jacocoTestReport(\s|$)'; then
            ./gradlew --no-daemon jacocoTestReport
          else
            echo "ℹ️ jacocoTestReport task not found; skipping coverage."
          fi

      - name: Optional style & static analysis
        run: |
          run_if_task() { ./gradlew -q tasks --all | grep -qE "^\s+$1(\s|$)" && ./gradlew --no-daemon $1 || echo "↷ skip $1"; }
          run_if_task spotlessCheck
          run_if_task checkstyleMain
          run_if_task checkstyleTest
          run_if_task pmdMain
          run_if_task pmdTest
          run_if_task spotbugsMain
          run_if_task spotbugsTest

      - name: Archive reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/reports/**/*
            **/build/reports/**/*

      - name: Summary
        if: always()
        run: |
          echo "### 🧪 Build & Test Summary" >> $GITHUB_STEP_SUMMARY
          if [ '${{ steps.tests.outcome }}' = 'success' ]; then
            echo "✅ Unit tests passed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Unit tests failed — check the logs and reports artifacts." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reports archived as artifact **reports**." >> $GITHUB_STEP_SUMMARY

  dependency-audit:
    runs-on: ubuntu-latest
    needs: wrapper-validation
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Cache OWASP DC data dir
        uses: actions/cache@v4
        with:
          path: ${{ env.DC_DATA_DIR }}
          key: depcheck-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/pom.xml', '**/package-lock.json') }}
          restore-keys: depcheck-${{ runner.os }}-

      - name: Dependency-Check
        id: dc-scan
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        with:
          project: ${{ github.repository }}
          path: .
          format: 'HTML'
          out: build/reports/dependency-check
          args: >
            --failOnCVSS 7
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableRetired

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-dependency-check
          path: build/reports/dependency-check/**

      - name: Summary
        if: always()
        run: |
          echo "### 🧩 Dependency Vulnerability Audit" >> $GITHUB_STEP_SUMMARY
          if [ '${{ steps.dc-scan.outcome }}' = 'success' ]; then
            echo "✅ Dependency-Check completed without blocking vulnerabilities." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Dependency-Check found vulnerabilities or failed; review *reports-dependency-check* artifact." >> $GITHUB_STEP_SUMMARY
          fi

  secrets-scan:
    runs-on: ubuntu-latest
    needs: wrapper-validation
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: zricethezav/gitleaks-action@v2
        with:
          args: detect --source . --no-git -v --redact --report-format sarif --report-path gitleaks.sarif

      - name: Upload Gitleaks SARIF
        if: hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

      - name: Summary
        if: always()
        run: |
          echo "### 🔐 Secrets Scan Summary" >> $GITHUB_STEP_SUMMARY
          if [ '${{ steps.gitleaks.outcome }}' = 'success' ]; then
            echo "✅ No secrets detected by Gitleaks." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Potential secrets detected — review the *Gitleaks SARIF* upload." >> $GITHUB_STEP_SUMMARY
          fi

  codeql:
    runs-on: ubuntu-latest
    needs: wrapper-validation
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
      - name: Summary
        if: always()
        run: |
          echo "### 🧠 CodeQL Analysis" >> $GITHUB_STEP_SUMMARY
          echo "CodeQL analysis uploaded to **Security → Code scanning alerts**." >> $GITHUB_STEP_SUMMARY
